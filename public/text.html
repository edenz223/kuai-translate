<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuai translate · 文本翻译</title><link rel="stylesheet" href="ui.css"></head>
<body><div class="page wide"><header class="page-header"><div class="brand"><span class="brand-mark" aria-hidden="true">K</span><div><h1>Kuai translate</h1><p>文本与字幕文件翻译</p></div></div><a href="options.html">设置与 API →</a></header>
<main class="card"><div class="form-grid three"><label>翻译服务<select id="provider"></select></label><label>原文语言<select id="source"></select></label><label>目标语言<select id="target"></select></label></div>
<div class="tool-row"><label class="file-button">打开本地文件<input id="file" type="file" accept=".txt,.md,.srt,.vtt,text/plain,text/markdown,text/vtt"></label><label class="compact-label">格式<select id="format"><option value="txt">TXT 文本</option><option value="md">Markdown</option><option value="srt">SRT 字幕</option><option value="vtt">WebVTT 字幕</option></select></label><span class="muted">最大 2 MB · 点击翻译后发送正文</span></div>
<div class="text-columns"><label>原文<textarea id="input" placeholder="粘贴需要翻译的文字，或打开本地文本文件。" spellcheck="false"></textarea></label><label>译文<textarea id="output" readonly placeholder="译文会显示在这里。" spellcheck="false"></textarea></label></div>
<p class="muted">字幕保留时间轴。Markdown 保留空行、标题/列表前缀和围栏代码块；复杂的行内排版请在导出后检查。</p><div class="actions"><button id="translate" class="primary" type="button" disabled>开始翻译</button><button id="cancel" type="button" disabled hidden>取消</button><button id="copy" type="button" disabled>复制译文</button><button id="download" type="button" disabled>下载译文</button></div><p id="status" class="status" role="status" aria-live="polite">原文保留在本地页面中。</p></main></div><script type="module" src="src/ui/text.js"></script></body></html>
