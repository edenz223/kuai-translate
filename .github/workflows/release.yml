name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - name: Check tag matches version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          package=$(node -p "require('./package.json').version")
          manifest=$(node -p "require('./public/manifest.json').version")
          if [ "$TAG" != "v$package" ] || [ "$package" != "$manifest" ]; then
            echo "::error::Tag $TAG, package.json $package and manifest.json $manifest must match"
            exit 1
          fi
          echo "version=$package" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm package
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; found = $0 == "## " version || index($0, "## " version " ") == 1; next }
            found
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Kuai translate $VERSION" "${notes[@]}"
          { echo "### Draft release $TAG"; echo; echo '```'; cat release/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
