name: Check and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm package
      - id: meta
        run: |
          echo "name=kuai-translate-$(node -p "require('./package.json').version")-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          { echo '### Package checksums'; echo; echo '```'; cat release/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.name }}
          path: release/
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory until the browser smoke run has proven stable on hosted runners.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Browser smoke scenarios
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          failed=()
          echo '### Browser smoke' >> "$GITHUB_STEP_SUMMARY"
          for scenario in default SMOKE_STRICT_CSP SMOKE_HN SMOKE_SLOTTED 'SMOKE_SLOTTED SMOKE_CARD' SMOKE_LINK_COLOR SMOKE_BLOCK_MODULE_FETCH SMOKE_YOUTUBE_BOOTSTRAP; do
            vars=()
            [ "$scenario" = default ] || for name in $scenario; do vars+=("$name=1"); done
            echo "::group::$scenario"
            if env "${vars[@]}" timeout 180 pnpm smoke; then
              echo "- ✅ $scenario" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ❌ $scenario" >> "$GITHUB_STEP_SUMMARY"
              failed+=("$scenario")
            fi
            echo '::endgroup::'
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Browser smoke failed: ${failed[*]}"
            exit 1
          fi
